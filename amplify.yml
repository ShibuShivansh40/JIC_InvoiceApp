version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
        - echo "export const API_URL = '${API_URL}';" > src/config.js
        - echo "export const API_KEY = '${API_KEY}';" >> src/config.js
    build:
      commands:
        - npm run build:web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
