version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
        - echo "export const API_URL = '${API_URL:-https://rupeefunda.com/api}';" > src/config.js
        - echo "export const API_KEY = '${API_KEY}';" >> src/config.js
        - echo "export const AUTH_USER = '${AUTH_USER:-jeevesh-gupta}';" >> src/config.js
        - echo "export const AUTH_PASS = '${AUTH_PASS:-mybirthdayis@2810$}';" >> src/config.js

    build:
      commands:
        - npm run build:web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
